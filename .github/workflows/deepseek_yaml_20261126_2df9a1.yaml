name: Android17 - Build Kernel (Root - BakaSU)

# Builds the Android17 kernel and publishes only the flashable ZIP and SHA-256 file.
on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel name shown in uname -r / Settings (CONFIG_LOCALVERSION). Default: ゼロツー002-RTX"
        default: "ゼロツー002-RTX"
        required: true
      uname_preset:
        description: "5.10 shows 5.10.357-Android17-<kernel_name>"
        type: choice
        default: "5.10"
        options: ["off", "4.19", "5.4", "5.10", "5.15", "6.1", "6.6"]
      clang_repo:
        description: "Clang repo (owner/name)"
        default: "kdrag0n/proton-clang"
      no_polly:
        description: "Disable LLVM Polly"
        type: boolean
        default: true
      force:
        description: "Rebuild even if a release already exists for this commit/name/preset"
        type: boolean
        default: false
  push:
    tags: ["android17-*", "root-android17-*"]

permissions:
  contents: write

concurrency:
  group: android17-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      name: ${{ steps.p.outputs.name }}
      slug: ${{ steps.p.outputs.slug }}
      tag: ${{ steps.p.outputs.tag }}
      preset: ${{ steps.p.outputs.preset }}
      preset_idx: ${{ steps.p.outputs.preset_idx }}
      fp: ${{ steps.p.outputs.fp }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NAME: ${{ inputs.kernel_name }}
          IN_PRESET: ${{ inputs.uname_preset }}
          IN_TAG: ${{ inputs.release_tag }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Keep UTF-8 letters/numbers (including Japanese); allow only safe separators.
          NAME="$(python3 -c 'import os; s=os.environ.get("IN_NAME") or "ゼロツー002-RTX"; print("".join(c for c in s if c.isalnum() or c in "._-"))')"
          [ -n "$NAME" ] || NAME="ゼロツー002-RTX"

          # ASCII-only slug for ZIP/config filenames.
          # Do not use iconv in a pipe under pipefail: dropping Japanese
          # characters can make iconv return status 1 and abort the step.
          SLUG="$(NAME="$NAME" python3 -c 'import os,re; s=os.environ["NAME"].encode("ascii", "ignore").decode(); print(re.sub(r"[^A-Za-z0-9._-]", "", s))')"
          [ -n "$SLUG" ] || SLUG="Android17"

          PRESET="${IN_PRESET:-5.15}"
          case "$PRESET" in
            off)  IDX=0 ;;
            4.19) IDX=1 ;;
            5.4)  IDX=2 ;;
            5.10) IDX=3 ;;
            5.15) IDX=4 ;;
            6.1)  IDX=5 ;;
            6.6)  IDX=6 ;;
            *) echo "::error::Invalid uname preset: $PRESET"; exit 1 ;;
          esac

          SHA="$(git rev-parse HEAD)"
          FP="${GITHUB_REF_NAME:-main}|$SHA|$NAME|$PRESET"

          TAG="${IN_TAG:-}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME:-$TAG}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_NAME:-main}" = "root" ]; then
              TAG_PREFIX="root-android17"
            else
              TAG_PREFIX="android17"
            fi
            LAST="$(gh release list --limit 200 --json tagName -q '.[].tagName' \
              | grep -E "^${TAG_PREFIX}-r[0-9]+$" \
              | sed 's/.*-r//' | sort -n | tail -1 || true)"
            TAG="${TAG_PREFIX}-r$(( ${LAST:-0} + 1 ))"
          fi

          SKIP=false
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select((.body // \"\") | contains(\"android17-fingerprint: $FP\")) | .tag_name" \
            | sed -n '1p' || true)"

          if [ -n "$EXISTING" ] && [ "${IN_FORCE:-false}" != "true" ]; then
            echo "::notice::Release $EXISTING already exists for this commit/name/preset. Skipping."
            SKIP=true
          fi

          {
            echo "skip=$SKIP"
            echo "name=$NAME"
            echo "slug=$SLUG"
            echo "tag=$TAG"
            echo "preset=$PRESET"
            echo "preset_idx=$IDX"
            echo "fp=$FP"
          } >> "$GITHUB_OUTPUT"

          echo "Kernel name: $NAME"
          echo "Slug: $SLUG"
          echo "Release tag: $TAG"
          echo "Uname preset: $PRESET"
          echo "Skip build: $SKIP"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAME: ${{ needs.plan.outputs.name }}
      SLUG: ${{ needs.plan.outputs.slug }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRESET: ${{ needs.plan.outputs.preset }}
      PRESET_IDX: ${{ needs.plan.outputs.preset_idx }}
      FP: ${{ needs.plan.outputs.fp }}
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      # ------------------------------------------------------------------
      # Integración manual de BakaSU (clonado directo en drivers/kernelsu)
      # ------------------------------------------------------------------
      - name: Integrate BakaSU manually (Manual Hook)
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail

          # Clonar BakaSU DIRECTAMENTE en drivers/kernelsu para que su Kbuild
          # detecte el repositorio Git y no abort la compilación.
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git drivers/kernelsu

          # Integrar en el sistema de build del kernel
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Insertar los hooks manuales dentro del cuerpo de las funciones
          # correctas (no después de la definición de la syscall).
          python3 - <<'PY'
          import re
          from pathlib import Path

          # --- Hook 1: ksu_handle_execveat dentro de do_execveat_common (fs/exec.c) ---
          p = Path("fs/exec.c")
          src = p.read_text(encoding="utf-8")
          if "ksu_handle_execveat(&fd" not in src:
              pat = re.compile(
                  r'(static int do_execveat_common\s*\([^)]+\)\s*\n\{)',
                  re.M
              )
              hook = (
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
                  '\t\t\t\t       void *argv, void *envp, int *flags);\n'
                  '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
                  '#endif\n'
              )
              src2, n = pat.subn(hook, src, count=1)
              if n == 0:
                  raise SystemExit("ERROR: do_execveat_common not found in fs/exec.c")
              p.write_text(src2, encoding="utf-8")
              print("OK: execveat hook inserted into do_execveat_common")
          else:
              print("SKIP: execveat hook already present")

          # --- Hook 2: ksu_handle_setresuid dentro de SYSCALL_DEFINE3(setresuid) (kernel/sys.c) ---
          p = Path("kernel/sys.c")
          src = p.read_text(encoding="utf-8")
          if "ksu_handle_setresuid(ruid" not in src:
              pat = re.compile(
                  r'(SYSCALL_DEFINE3\s*\(\s*setresuid\b[^)]*\)\s*\n\{)',
                  re.M
              )
              hook = (
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\textern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n'
                  '\tksu_handle_setresuid(ruid, euid, suid);\n'
                  '#endif\n'
              )
              src2, n = pat.subn(hook, src, count=1)
              if n == 0:
                  raise SystemExit("ERROR: SYSCALL_DEFINE3(setresuid) not found in kernel/sys.c")
              p.write_text(src2, encoding="utf-8")
              print("OK: setresuid hook inserted")
          else:
              print("SKIP: setresuid hook already present")
          PY

          echo "--- Verificación de hooks ---"
          grep -n -A3 'ksu_handle_execveat(&fd' fs/exec.c || true
          grep -n -A2 'ksu_handle_setresuid(ruid' kernel/sys.c || true

      # ------------------------------------------------------------------
      # Exportar write_op (red de seguridad; CONFIG_KALLSYMS_ALL ya está en el defconfig)
      # ------------------------------------------------------------------
      - name: Export write_op symbol
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          SELINUXFS="security/selinux/selinuxfs.c"
          if [ -f "$SELINUXFS" ] && ! grep -q 'EXPORT_SYMBOL(write_op)' "$SELINUXFS"; then
            python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("security/selinux/selinuxfs.c")
          src = p.read_text(encoding="utf-8")
          # Insertar EXPORT_SYMBOL(write_op) justo después de la definición del array write_op[]
          pat = re.compile(r'(static ssize_t \(\*write_op\[\]\).*?\};)', re.S)
          src2, n = pat.subn(r'\1\nEXPORT_SYMBOL(write_op);', src, count=1)
          if n == 0:
              raise SystemExit("ERROR: write_op[] definition not found in selinuxfs.c")
          p.write_text(src2, encoding="utf-8")
          print("OK: write_op exported")
          PY
          else
            echo "write_op ya exportado o archivo no encontrado"
          fi

      - name: Enable BakaSU in miatoll defconfig (root branch only)
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          test -f "$CFG"
          grep -q '^CONFIG_KSU=y$' "$CFG" || echo 'CONFIG_KSU=y' >> "$CFG"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG" || echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CFG"
          tail -n 8 "$CFG"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio zip \
            python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler \
            libncurses-dev ccache xz-utils

      - name: Apply kernel uname patch
        run: python3 scripts/apply-skynet-uname.py .

      - name: Set selected uname release and build date
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          export BUILD_DATE NAME PRESET
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("kernel/skynet_uname.c")
          src = path.read_text(encoding="utf-8")
          preset = os.environ["PRESET"]
          name = os.environ["NAME"]
          build_date = os.environ["BUILD_DATE"]

          if preset != "off":
              pattern = re.compile(
                  r'(\{\s*"' + re.escape(preset) +
                  r'"\s*,\s*")([^"]+)(")'
              )
              match = pattern.search(src)
              if not match:
                  raise SystemExit(f"Preset {preset} was not found in {path}")
              base = re.match(r"(\d+\.\d+\.\d+)", match.group(2))
              if not base:
                  raise SystemExit(f"Could not parse release for preset {preset}")
              # The requested public uname/banner release for the 5.10 preset.
              base_version = "5.10.357" if preset == "5.10" else base.group(1)
              release = f"{base_version}-Android17-{name}"
              src = src[:match.start(2)] + release + src[match.end(2):]

              if preset == "5.15":
                  version_pattern = re.compile(
                      r'("5\.15"\s*,\s*"[^"]+"\s*,\s*\n\s*")([^"]+)(")'
                  )
                  src, count = version_pattern.subn(
                      lambda m: m.group(1) + f"#1 SMP PREEMPT {build_date}" + m.group(3),
                      src, count=1
                  )
                  if count != 1:
                      raise SystemExit("Could not update the 5.15 uname date")
              path.write_text(src, encoding="utf-8")
              print(f"Selected uname release: {release}")
          else:
              print("Uname preset is off; retaining the source kernel release")

          print(f"Shared build timestamp: {build_date}")
          PY

      - name: Set clean kernel banner
        run: |
          set -euo pipefail
          if [ "$PRESET" = "off" ]; then
            BASE_VERSION="$(make -s kernelversion)"
            BANNER_SUFFIX="-$NAME"
          else
            BANNER_SUFFIX="-Android17-$NAME"
            BASE_VERSION="$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          src = Path("kernel/skynet_uname.c").read_text(encoding="utf-8")
          preset = re.escape(os.environ["PRESET"])
          match = re.search(r'\{\s*"' + preset + r'"\s*,\s*"([^"]+)"', src)
          if not match:
              raise SystemExit("Selected uname preset release not found")
          version = re.match(r"(\d+\.\d+\.\d+)", match.group(1))
          if not version:
              raise SystemExit("Could not parse selected kernel version")
          print(version.group(1))
          PY
          )"
          fi
          BANNER_RELEASE="${BASE_VERSION}${BANNER_SUFFIX}"
          export BANNER_RELEASE
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("init/version.c")
          if not path.is_file():
              raise SystemExit("init/version.c was not found; refusing to build with an unmodified banner")
          src = path.read_text(encoding="utf-8")
          replacement = 'const char linux_banner[] = "' + os.environ["BANNER_RELEASE"] + '\\n";'
          pattern = re.compile(r'const char linux_banner\[\]\s*=.*?;', re.S)
          src, count = pattern.subn(lambda _match: replacement, src, count=1)
          if count != 1:
              raise SystemExit("Could not locate linux_banner in init/version.c")
          path.write_text(src, encoding="utf-8")
          print("Kernel banner:", replacement.split('"')[1])
          PY

      - name: Set kernel name (CONFIG_LOCALVERSION)
        run: |
          CFG=arch/arm64/configs/$DEFCONFIG
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO/d;/^# CONFIG_LOCALVERSION_AUTO/d' "$CFG"
          {
            echo "CONFIG_LOCALVERSION=\"-$NAME\""
            echo "# CONFIG_LOCALVERSION_AUTO is not set"
          } >> "$CFG"
          grep -n LOCALVERSION "$CFG"

      - name: Fetch Clang
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'kdrag0n/proton-clang' }}
        run: git clone --depth=1 "https://github.com/$CLANG_REPO" "$HOME/clang"

      - name: Build kernel
        env:
          NO_POLLY: ${{ github.event_name == 'push' && 'true' || inputs.no_polly }}
        run: |
          set -eo pipefail
          LLVM_BIN="$HOME/clang/bin"

          # IMPORTANT: keep Ubuntu tools first in PATH. GCC invokes `ld` by
          # searching PATH; putting the bundled Clang directory first makes
          # host utilities accidentally use its incompatible `ld` binary.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$LLVM_BIN"
          export KBUILD_BUILD_USER=Android
          export KBUILD_BUILD_HOST=Android
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="$BUILD_DATE"
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld

          # Fail early if the downloaded LLVM toolchain is incomplete.
          test -x "$LLVM_BIN/clang"
          test -x "$LLVM_BIN/ld.lld"
          test -x "$LLVM_BIN/llvm-ar"
          echo "Host linker: $(command -v ld)"
          /usr/bin/ld --version | head -1
          echo "Kernel compiler: $LLVM_BIN/clang"

          # Use absolute LLVM paths for the ARM64 target; host tools remain GCC/BFD.
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="$LLVM_BIN/clang"
            LD="$LLVM_BIN/ld.lld"
            AR="$LLVM_BIN/llvm-ar"
            NM="$LLVM_BIN/llvm-nm"
            OBJCOPY="$LLVM_BIN/llvm-objcopy"
            OBJDUMP="$LLVM_BIN/llvm-objdump"
            STRIP="$LLVM_BIN/llvm-strip"
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS=-DSKYNET_UNAME_DEFAULT=$PRESET_IDX
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"
          if [ "$NO_POLLY" = "true" ]; then
            scripts/config --file out/.config -d LLVM_POLLY || true
            make "${MAKE_ARGS[@]}" olddefconfig
          fi
          # Build both the standalone compressed kernel and the DTB-appended image.
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image.gz Image.gz-dtb
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/Image.gz-dtb
          make "${MAKE_ARGS[@]}" -j"$(nproc)" dtbo.img || echo "::warning::dtbo.img not produced"

      - name: Verify kernel name
        run: |
          REL=$(cat out/include/config/kernel.release)
          echo "kernel.release = $REL"
          case "$REL" in *"-$NAME"*) ;; *) echo "::error::kernel.release '$REL' does not contain -$NAME"; exit 1;; esac
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 ZIP
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE
          cp anykernel3/anykernel.sh ak3/anykernel.sh

          # Advertise the complete Xiaomi Miatoll family in the installer metadata.
          sed -i "s|^kernel.string=.*|kernel.string=$NAME Android17 Kernel for all Xiaomi Miatoll devices ($REL)|" ak3/anykernel.sh

          cp out/arch/arm64/boot/Image.gz ak3/
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          if [ -s out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak3/
          fi

          ZIP="${SLUG}-miatoll-${TAG}.zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '.git*')
          sha256sum "$ZIP" > "$ZIP.sha"
          unzip -t "$ZIP" >/dev/null
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Created release files:"
          ls -lh "$ZIP" "$ZIP.sha"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Describe the source commits in the release notes.
          {
            echo "## Android17 Kernel"
            echo
            echo "Kernel build for **all Xiaomi Miatoll-family devices**:"
            echo "- Device codenames supported by the installer: curtana, joyeuse, excalibur, gram and miatoll"
            echo
            echo "### Kernel information"
            echo "- Kernel release: \`$REL\`"
            echo "- Uname preset: \`$PRESET\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo
            echo "### Included source commits"
            git log -10 --pretty=format:'- \`%h\` %s' "$GITHUB_SHA"
            echo
            echo
            echo "### Files"
            echo "- \`$ZIP\` — flashable AnyKernel3 package"
            echo "- \`$ZIP.sha\` — SHA-256 checksum"
            echo
            echo "Build fingerprint: \`$FP\`"
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$ZIP" "$ZIP.sha" \
            --target "$GITHUB_SHA" \
            --title "$NAME $TAG ($REL)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-check
          cd release-check
          gh release download "$TAG" --pattern '*.zip' --pattern '*.sha'
          sha_file="$(find . -maxdepth 1 -name '*.sha' -print -quit)"
          zip_file="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$sha_file" && test -n "$zip_file"
          sha256sum -c "$sha_file"
          unzip -t "$zip_file" >/dev/null
          assets="$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)"
          expected="$(printf '%s\n%s' "$ZIP" "$ZIP.sha" | sort)"
          if [ "$assets" != "$expected" ]; then
            echo "::error::Release contains unexpected assets:"
            printf '%s\n' "$assets"
            exit 1
          fi
          echo "Release verified: only ZIP and SHA file are published."