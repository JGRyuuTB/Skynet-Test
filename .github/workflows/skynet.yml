name: SKYNET - Build and Release

# Single workflow: checks GitHub Releases, patches, builds, packages,
# publishes and verifies the release.
on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel name shown in uname -r / Settings (CONFIG_LOCALVERSION), e.g. SKYNET"
        default: "ゼロツー002-RTX"
        required: true
      uname_preset:
        description: "Default uname spoof at boot (changeable later via /proc/skynet_uname)"
        type: choice
        default: "off"
        options: ["off", "4.19", "5.4", "5.10", "5.15", "6.1", "6.6"]
      release_tag:
        description: "Release tag (empty = auto skynet-17-r<N>)"
        default: ""
      clang_repo:
        description: "Clang repo (owner/name)"
        default: "kdrag0n/proton-clang"
      no_polly:
        description: "Disable LLVM Polly"
        type: boolean
        default: true
      publish:
        description: "Publish to GitHub Releases"
        type: boolean
        default: true
      force:
        description: "Rebuild even if a release already exists for this commit/name/preset"
        type: boolean
        default: false
  push:
    tags: ["skynet-17-*"]

permissions:
  contents: write

concurrency:
  group: skynet-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      name: ${{ steps.p.outputs.name }}
      slug: ${{ steps.p.outputs.slug }}
      tag: ${{ steps.p.outputs.tag }}
      preset: ${{ steps.p.outputs.preset }}
      preset_idx: ${{ steps.p.outputs.preset_idx }}
      fp: ${{ steps.p.outputs.fp }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NAME: ${{ inputs.kernel_name }}
          IN_PRESET: ${{ inputs.uname_preset }}
          IN_TAG: ${{ inputs.release_tag }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Keep UTF-8 letters/numbers (including Japanese); allow only safe separators.
          NAME="$(python3 -c 'import os; s=os.environ.get("IN_NAME") or "ゼロツー002-RTX"; print("".join(c for c in s if c.isalnum() or c in "._-"))')"
          [ -n "$NAME" ] || NAME="ゼロツー002-RTX"

          # ASCII-only slug for ZIP/config filenames.
          # Do not use iconv in a pipe under pipefail: dropping Japanese
          # characters can make iconv return status 1 and abort the step.
          SLUG="$(NAME="$NAME" python3 -c 'import os,re; s=os.environ["NAME"].encode("ascii", "ignore").decode(); print(re.sub(r"[^A-Za-z0-9._-]", "", s))')"
          [ -n "$SLUG" ] || SLUG="SKYNET"

          PRESET="${IN_PRESET:-off}"
          case "$PRESET" in
            off)  IDX=0 ;;
            4.19) IDX=1 ;;
            5.4)  IDX=2 ;;
            5.10) IDX=3 ;;
            5.15) IDX=4 ;;
            6.1)  IDX=5 ;;
            6.6)  IDX=6 ;;
            *) echo "::error::Invalid uname preset: $PRESET"; exit 1 ;;
          esac

          SHA="$(git rev-parse HEAD)"
          FP="$SHA|$NAME|$PRESET"

          TAG="${IN_TAG:-}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME:-$TAG}"
          fi
          if [ -z "$TAG" ]; then
            LAST="$(gh release list --limit 200 --json tagName -q '.[].tagName' \
              | grep -E '^skynet-17-r[0-9]+$' \
              | sed 's/.*-r//' | sort -n | tail -1 || true)"
            TAG="skynet-17-r$(( ${LAST:-0} + 1 ))"
          fi

          SKIP=false
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select((.body // \"\") | contains(\"skynet-fingerprint: $FP\")) | .tag_name" \
            | sed -n '1p' || true)"

          if [ -n "$EXISTING" ] && [ "${IN_FORCE:-false}" != "true" ]; then
            echo "::notice::Release $EXISTING already exists for this commit/name/preset. Skipping."
            SKIP=true
          fi

          {
            echo "skip=$SKIP"
            echo "name=$NAME"
            echo "slug=$SLUG"
            echo "tag=$TAG"
            echo "preset=$PRESET"
            echo "preset_idx=$IDX"
            echo "fp=$FP"
          } >> "$GITHUB_OUTPUT"

          echo "Kernel name: $NAME"
          echo "Slug: $SLUG"
          echo "Release tag: $TAG"
          echo "Uname preset: $PRESET"
          echo "Skip build: $SKIP"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAME: ${{ needs.plan.outputs.name }}
      SLUG: ${{ needs.plan.outputs.slug }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRESET: ${{ needs.plan.outputs.preset }}
      PRESET_IDX: ${{ needs.plan.outputs.preset_idx }}
      FP: ${{ needs.plan.outputs.fp }}
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio zip \
            python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler \
            libncurses-dev ccache xz-utils

      - name: Apply uname spoof patch
        run: python3 scripts/apply-skynet-uname.py .

      - name: Set kernel name (CONFIG_LOCALVERSION)
        run: |
          CFG=arch/arm64/configs/$DEFCONFIG
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO/d;/^# CONFIG_LOCALVERSION_AUTO/d' "$CFG"
          {
            echo "CONFIG_LOCALVERSION=\"-$NAME\""
            echo "# CONFIG_LOCALVERSION_AUTO is not set"
          } >> "$CFG"
          grep -n LOCALVERSION "$CFG"

      - name: Fetch Clang
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'kdrag0n/proton-clang' }}
        run: git clone --depth=1 "https://github.com/$CLANG_REPO" "$HOME/clang"

      - name: Build kernel
        env:
          NO_POLLY: ${{ github.event_name == 'push' && 'true' || inputs.no_polly }}
        run: |
          set -eo pipefail
          LLVM_BIN="$HOME/clang/bin"

          # IMPORTANT: keep Ubuntu tools first in PATH. GCC invokes `ld` by
          # searching PATH; putting the bundled Clang directory first makes
          # host utilities accidentally use its incompatible `ld` binary.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$LLVM_BIN"
          export KBUILD_BUILD_USER=skynet KBUILD_BUILD_HOST=github
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld

          # Fail early if the downloaded LLVM toolchain is incomplete.
          test -x "$LLVM_BIN/clang"
          test -x "$LLVM_BIN/ld.lld"
          test -x "$LLVM_BIN/llvm-ar"
          echo "Host linker: $(command -v ld)"
          /usr/bin/ld --version | head -1
          echo "Kernel compiler: $LLVM_BIN/clang"

          # Use absolute LLVM paths for the ARM64 target; host tools remain GCC/BFD.
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="$LLVM_BIN/clang"
            LD="$LLVM_BIN/ld.lld"
            AR="$LLVM_BIN/llvm-ar"
            NM="$LLVM_BIN/llvm-nm"
            OBJCOPY="$LLVM_BIN/llvm-objcopy"
            OBJDUMP="$LLVM_BIN/llvm-objdump"
            STRIP="$LLVM_BIN/llvm-strip"
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS=-DSKYNET_UNAME_DEFAULT=$PRESET_IDX
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"
          if [ "$NO_POLLY" = "true" ]; then
            scripts/config --file out/.config -d LLVM_POLLY || true
            make "${MAKE_ARGS[@]}" olddefconfig
          fi
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image.gz-dtb
          make "${MAKE_ARGS[@]}" -j"$(nproc)" dtbo.img || echo "::warning::dtbo.img not produced"

      - name: Verify kernel name
        run: |
          REL=$(cat out/include/config/kernel.release)
          echo "kernel.release = $REL"
          case "$REL" in *"-$NAME"*) ;; *) echo "::error::kernel.release '$REL' does not contain -$NAME"; exit 1;; esac
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 ZIP
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE
          cp anykernel3/anykernel.sh ak3/anykernel.sh
          sed -i "s|^kernel.string=.*|kernel.string=$NAME Kernel for miatoll ($REL)|" ak3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ak3/ || true
          cp scripts/skynet-uname.sh ak3/skynet-uname.sh
          cat > ak3/skynet-build.prop <<PROP
          kernel.release=$REL
          kernel.name=$NAME
          uname.default=$PRESET
          source.commit=$GITHUB_SHA
          build.utc=$(date -u +%FT%TZ)
          PROP
          sed -i 's/^          //' ak3/skynet-build.prop
          ZIP="${SLUG}-miatoll-${TAG}.zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '.git*')
          sha256sum "$ZIP" > "$ZIP.sha256"
          unzip -t "$ZIP" >/dev/null
          cp out/.config "${SLUG}-${TAG}.config"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: skynet-kernel-zip
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.SLUG }}-${{ env.TAG }}.config

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          **$NAME** kernel for Xiaomi miatoll (curtana / joyeuse / excalibur / gram)

          - kernel.release: \`$REL\`
          - uname spoof default: \`$PRESET\` (change at runtime: \`su -c sh skynet-uname.sh list\`, or \`echo 5.10 > /proc/skynet_uname\`)
          - commit: \`$GITHUB_SHA\`

          UNTESTED build: back up boot/dtbo before flashing.

          <!-- skynet-fingerprint: $FP -->
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" "$SLUG-$TAG.config" \
            --target "$GITHUB_SHA" --title "$NAME $TAG ($REL)" --notes-file notes.md --prerelease

      - name: Verify release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$TAG" --pattern "$ZIP" --pattern "$ZIP.sha256"
          sha256sum -c "$ZIP.sha256"
          unzip -t "$ZIP" >/dev/null
          unzip -p "$ZIP" skynet-build.prop | grep "kernel.release=$REL"
          gh release view "$TAG" --json body -q .body | grep -F "skynet-fingerprint: $FP"
          echo "Release $TAG verified"
