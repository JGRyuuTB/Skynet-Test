name: Android17 - Build Kernel (Root - BakaSU)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión del release (Ej: R1, R2, v1.0)"
        default: "R1"
        required: true
      kernel_name:
        description: "Kernel name shown in uname -r / Settings (CONFIG_LOCALVERSION). Default: ゼロツー002-RTX"
        default: "ゼロツー002-RTX"
        required: true
      uname_preset:
        description: "Uname preset to patch (use 5.15; release is forced to 5.15.170-Android17-<kernel_name>)"
        type: choice
        default: "5.15"
        options: ["off", "4.19", "5.4", "5.10", "5.15", "6.1", "6.6"]
      clang_repo:
        description: "Clang repo (owner/name)"
        default: "kdrag0n/proton-clang"
      no_polly:
        description: "Disable LLVM Polly"
        type: boolean
        default: true
      force:
        description: "Rebuild even if a release already exists"
        type: boolean
        default: false
  push:
    tags: ["android17-*", "root-android17-*"]

permissions:
  contents: write

concurrency:
  group: android17-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.p.outputs.skip }}
      name: ${{ steps.p.outputs.name }}
      slug: ${{ steps.p.outputs.slug }}
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      preset: ${{ steps.p.outputs.preset }}
      preset_idx: ${{ steps.p.outputs.preset_idx }}
      fp: ${{ steps.p.outputs.fp }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NAME: ${{ inputs.kernel_name }}
          IN_PRESET: ${{ inputs.uname_preset }}
          IN_VERSION: ${{ inputs.release_version }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          NAME="$(python3 -c 'import os; s=os.environ.get("IN_NAME") or "ゼロツー002-RTX"; print("".join(c for c in s if c.isalnum() or c in "._-"))')"
          [ -n "$NAME" ] || NAME="ゼロツー002-RTX"
          SLUG="$(NAME="$NAME" python3 -c 'import os,re; s=os.environ["NAME"].encode("ascii", "ignore").decode(); print(re.sub(r"[^A-Za-z0-9._-]", "", s))')"
          [ -n "$SLUG" ] || SLUG="Android17"
          PRESET="${IN_PRESET:-5.15}"
          case "$PRESET" in
            off)  IDX=0 ;; 4.19) IDX=1 ;; 5.4)  IDX=2 ;; 5.10) IDX=3 ;;
            5.15) IDX=4 ;; 6.1)  IDX=5 ;; 6.6)  IDX=6 ;;
            *) echo "::error::Invalid uname preset: $PRESET"; exit 1 ;;
          esac
          SHA="$(git rev-parse HEAD)"
          FP="${GITHUB_REF_NAME:-main}|$SHA|$NAME|$PRESET"

          VERSION="${IN_VERSION:-R1}"
          TAG="BakaSU-${VERSION}"

          SKIP=false
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q ".[] | select((.body // \"\") | contains(\"android17-fingerprint: $FP\")) | .tag_name" | sed -n '1p' || true)"
          if [ -n "$EXISTING" ] && [ "${IN_FORCE:-false}" != "true" ]; then SKIP=true; fi
          {
            echo "skip=$SKIP"; echo "name=$NAME"; echo "slug=$SLUG"; echo "tag=$TAG"
            echo "version=$VERSION"
            echo "preset=$PRESET"; echo "preset_idx=$IDX"; echo "fp=$FP"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAME: ${{ needs.plan.outputs.name }}
      SLUG: ${{ needs.plan.outputs.slug }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRESET: ${{ needs.plan.outputs.preset }}
      PRESET_IDX: ${{ needs.plan.outputs.preset_idx }}
      FP: ${{ needs.plan.outputs.fp }}
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 10 }

      - name: Integrate BakaSU (hooks manuales)
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/Baka-SU/BakaSU.git KernelSU
          KSU_KERNEL_DIR=""
          for d in KernelSU/kernel KernelSU; do
              [ -f "$d/Kconfig" ] && KSU_KERNEL_DIR="$d" && break
          done
          [ -n "$KSU_KERNEL_DIR" ] || { echo "::error::Kconfig no encontrado"; exit 1; }
          ln -sfn "../$KSU_KERNEL_DIR" drivers/kernelsu
          sed -i 's/\$(error You should use BakaSU as a git submodule/\$(warning You should use BakaSU as a git submodule/' "$KSU_KERNEL_DIR/Kbuild" || true
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          python3 - <<'PY'
          import re
          from pathlib import Path

          # Hook 1: execveat
          p = Path("fs/exec.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_execveat(&fd" not in src:
              pat = re.compile(r'(static int do_execveat_common\s*\([^)]+\)\s*\n\{)', re.M)
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
                      '\t\t\t\t       void *argv, void *envp, int *flags);\n'
                      '\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0: raise SystemExit("ERROR: do_execveat_common not found")
              p.write_text(src2, encoding="utf-8"); print("OK: execveat")

          # Hook 2: setresuid
          p = Path("kernel/sys.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_setresuid(ruid" not in src:
              pat = re.compile(r'(SYSCALL_DEFINE3\s*\(\s*setresuid\b[^)]*\)\s*\n\{)', re.M)
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n'
                      '\tksu_handle_setresuid(ruid, euid, suid);\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0: raise SystemExit("ERROR: SYSCALL_DEFINE3(setresuid) not found")
              p.write_text(src2, encoding="utf-8"); print("OK: setresuid")

          # Hook 3: faccessat
          p = Path("fs/open.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_faccessat(&dfd" not in src:
              pat = re.compile(r'(SYSCALL_DEFINE3\s*\(\s*faccessat\b[^)]*\)\s*\n\{)', re.M)
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
                      '\t\t\t\t\tint *mode, int *flags);\n'
                      '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0:
                  pat2 = re.compile(r'(static long do_faccessat\s*\([^)]+\)\s*\n\{)', re.M)
                  src2, n = pat2.subn(hook, src, count=1)
                  if n == 0: raise SystemExit("ERROR: faccessat/do_faccessat not found")
              p.write_text(src2, encoding="utf-8"); print("OK: faccessat")

          # Hook 4: ksu_handle_stat dentro de newfstatat
          p = Path("fs/stat.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_stat(&dfd" not in src:
              m_sig = re.search(r'SYSCALL_DEFINE4\s*\(\s*newfstatat\b[^)]*\)', src)
              var = "flag"
              if m_sig:
                  m_var = re.search(r',\s*int\s*,\s*(\w+)\s*\)', m_sig.group(0))
                  if m_var: var = m_var.group(1)
              pat = re.compile(r'(SYSCALL_DEFINE4\s*\(\s*newfstatat\b[^)]*\)\s*\n\{)', re.M)
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n'
                      '\t\t\t\t    int *flags);\n'
                      f'\tksu_handle_stat(&dfd, &filename, &{var});\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0: print("WARN: newfstatat no encontrado")
              else:
                  p.write_text(src2, encoding="utf-8")
                  print(f"OK: stat (variable usada: {var})")

          # Hook 5: ksu_handle_newfstat_ret
          p = Path("fs/stat.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_newfstat_ret(&fd" not in src:
              pat = re.compile(
                  r'(SYSCALL_DEFINE2\s*\(\s*newfstat\s*,[^)]*struct stat __user \*,\s*statbuf\s*\)\s*\n\{.*?'
                  r'error = cp_new_stat\(&stat, statbuf\);)',
                  re.S
              )
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n'
                      '\tksu_handle_newfstat_ret(&fd, &statbuf);\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0:
                  pat2 = re.compile(r'(SYSCALL_DEFINE2\s*\(\s*newfstat\b.*?\n\{.*?)(\n\s*return error;)', re.S)
                  def repl(m): return (m.group(1) + '\n#ifdef CONFIG_KSU\n\textern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif' + m.group(2))
                  src2, n = pat2.subn(repl, src, count=1)
                  if n == 0: raise SystemExit("ERROR: newfstat not found")
              p.write_text(src2, encoding="utf-8"); print("OK: newfstat_ret")

          # Hook 6: ksu_handle_fstat64_ret
          p = Path("fs/stat.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_fstat64_ret(&fd" not in src:
              pat = re.compile(
                  r'(SYSCALL_DEFINE2\s*\(\s*fstat64\s*,[^)]*struct stat64 __user \*,\s*statbuf\s*\)\s*\n\{.*?'
                  r'error = cp_new_stat64\(&stat, statbuf\);)',
                  re.S
              )
              hook = (r'\1\n#ifdef CONFIG_KSU\n'
                      '\textern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n'
                      '\tksu_handle_fstat64_ret(&fd, &statbuf);\n'
                      '#endif\n')
              src2, n = pat.subn(hook, src, count=1)
              if n == 0:
                  pat2 = re.compile(r'(SYSCALL_DEFINE2\s*\(\s*fstat64\b.*?\n\{.*?)(\n\s*return error;)', re.S)
                  def repl64(m): return (m.group(1) + '\n#ifdef CONFIG_KSU\n\textern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif' + m.group(2))
                  src2, n = pat2.subn(repl64, src, count=1)
                  if n == 0: raise SystemExit("ERROR: fstat64 not found")
              p.write_text(src2, encoding="utf-8"); print("OK: fstat64_ret")

          # Hook 7: ksu_handle_sys_reboot
          p = Path("kernel/reboot.c"); src = p.read_text(encoding="utf-8")
          if "ksu_handle_sys_reboot(magic1" not in src:
              pat_ext = re.compile(r'(SYSCALL_DEFINE4\s*\(\s*reboot\s*,\s*int\s*,\s*magic1\b)', re.M)
              ext = (r'#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                     'extern int ksu_handle_sys_reboot(int magic1, int magic2,\n'
                     '                                 unsigned int cmd, void __user **arg);\n'
                     '#endif\n\n'
                     r'\1')
              src2, n = pat_ext.subn(ext, src, count=1)
              if n == 0: raise SystemExit("ERROR: SYSCALL_DEFINE4(reboot) no encontrado")
              src = src2
              pat_call = re.compile(r'(SYSCALL_DEFINE4\s*\(\s*reboot\b.*?\n\{.*?int\s+ret\s*=\s*0;)', re.S)
              call = (r'\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n'
                      '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
                      '#endif')
              src3, n = pat_call.subn(call, src, count=1)
              if n == 0:
                  pat_ns = re.compile(r'(\n\s*if\s*\(!ns_capable\([^;]*CAP_SYS_BOOT\)\))', re.S)
                  src3, n = pat_ns.subn(r'\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\1', src, count=1)
                  if n == 0: raise SystemExit("ERROR: no se encontró punto de inserción para sys_reboot")
              p.write_text(src3, encoding="utf-8")
              print("OK: sys_reboot")
          PY

      - name: Export write_op
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          SELINUXFS="security/selinux/selinuxfs.c"
          test -f "$SELINUXFS" || { echo "::error::$SELINUXFS no existe"; exit 1; }
          sed -i 's/^static ssize_t (\*write_op\[\])/ssize_t (*write_op[])/' "$SELINUXFS" || true
          if ! grep -q 'EXPORT_SYMBOL(write_op)' "$SELINUXFS"; then
            printf '\nEXPORT_SYMBOL(write_op);\n' >> "$SELINUXFS"
          fi

      - name: Enable BakaSU in defconfig
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          CFG="arch/arm64/configs/$DEFCONFIG"
          test -f "$CFG"
          grep -q '^CONFIG_DEBUG_KERNEL=y$' "$CFG" || echo 'CONFIG_DEBUG_KERNEL=y' >> "$CFG"
          grep -q '^CONFIG_KALLSYMS=y$' "$CFG" || echo 'CONFIG_KALLSYMS=y' >> "$CFG"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$CFG" || echo 'CONFIG_KALLSYMS_ALL=y' >> "$CFG"
          grep -q '^CONFIG_KSU=y$' "$CFG" || echo 'CONFIG_KSU=y' >> "$CFG"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG" || echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CFG"

      - name: Patch BakaSU checks
        if: github.ref_name == 'root'
        run: |
          set -euo pipefail
          for chk in KernelSU/kernel/tools/static_export_check.mk KernelSU/kernel/tools/manual_hook_check.mk; do
            [ -f "$chk" ] && sed -i 's/\$(error You should integrate BakaSU in your kernel\. \.)/\$(warning You should integrate BakaSU in your kernel)/' "$chk" || true
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio zip python3 lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler libncurses-dev ccache xz-utils jq

      - name: Apply kernel uname patch
        run: python3 scripts/apply-skynet-uname.py .

      - name: Set selected uname release and build date (Forzar 5.15.170)
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          export BUILD_DATE NAME PRESET
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("kernel/skynet_uname.c"); src = path.read_text(encoding="utf-8")
          preset = os.environ["PRESET"]; name = os.environ["NAME"]; build_date = os.environ["BUILD_DATE"]
          if preset != "off":
              pattern = re.compile(r'(\{\s*"' + re.escape(preset) + r'"\s*,\s*")([^"]+)(")')
              match = pattern.search(src)
              if not match: raise SystemExit(f"Preset {preset} not found")
              release = f"5.15.170-Android17-{name}"
              src = src[:match.start(2)] + release + src[match.end(2):]
              if preset == "5.15":
                  vp = re.compile(r'("5\.15"\s*,\s*"[^"]+"\s*,\s*\n\s*")([^"]+)(")')
                  src, count = vp.subn(lambda m: m.group(1) + f"#1 SMP PREEMPT {build_date}" + m.group(3), src, count=1)
              path.write_text(src, encoding="utf-8")
          PY

      - name: Set clean kernel banner (Forzar 5.15.170)
        run: |
          set -euo pipefail
          BANNER_RELEASE="5.15.170-Android17-$NAME"
          export BANNER_RELEASE
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("init/version.c")
          if not path.is_file(): raise SystemExit("init/version.c not found")
          src = path.read_text(encoding="utf-8")
          replacement = 'const char linux_banner[] = "' + os.environ["BANNER_RELEASE"] + '\\n";'
          pattern = re.compile(r'const char linux_banner\[\]\s*=.*?;', re.S)
          src, count = pattern.subn(lambda _m: replacement, src, count=1)
          if count != 1: raise SystemExit("Could not locate linux_banner")
          path.write_text(src, encoding="utf-8")
          PY

      - name: Set kernel name (CONFIG_LOCALVERSION)
        run: |
          CFG=arch/arm64/configs/$DEFCONFIG
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO/d;/^# CONFIG_LOCALVERSION_AUTO/d' "$CFG"
          { echo "CONFIG_LOCALVERSION=\"-$NAME\""; echo "# CONFIG_LOCALVERSION_AUTO is not set"; } >> "$CFG"

      - name: Fetch Clang
        env:
          CLANG_REPO: ${{ inputs.clang_repo || 'kdrag0n/proton-clang' }}
        run: git clone --depth=1 "https://github.com/$CLANG_REPO" "$HOME/clang"

      - name: Build kernel
        env:
          NO_POLLY: ${{ github.event_name == 'push' && 'true' || inputs.no_polly }}
        run: |
          set -eo pipefail
          LLVM_BIN="$HOME/clang/bin"
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$LLVM_BIN"
          export KBUILD_BUILD_USER=Android KBUILD_BUILD_HOST=Android KBUILD_BUILD_VERSION=1 KBUILD_BUILD_TIMESTAMP="$BUILD_DATE"
          export HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld
          MAKE_ARGS=(
            O=out ARCH=arm64 CC="$LLVM_BIN/clang" LD="$LLVM_BIN/ld.lld" AR="$LLVM_BIN/llvm-ar"
            NM="$LLVM_BIN/llvm-nm" OBJCOPY="$LLVM_BIN/llvm-objcopy" OBJDUMP="$LLVM_BIN/llvm-objdump" STRIP="$LLVM_BIN/llvm-strip"
            HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLD=/usr/bin/ld
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS=-DSKYNET_UNAME_DEFAULT=$PRESET_IDX
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"
          make "${MAKE_ARGS[@]}" olddefconfig

          sed -i 's/^# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' out/.config || true
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || echo 'CONFIG_KALLSYMS_ALL=y' >> out/.config

          if [ "$NO_POLLY" = "true" ]; then sed -i 's/^CONFIG_LLVM_POLLY=y/# CONFIG_LLVM_POLLY is not set/' out/.config || true; fi

          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image.gz Image.gz-dtb
          make "${MAKE_ARGS[@]}" -j"$(nproc)" dtbo.img || echo "::warning::dtbo.img not produced"

      - name: Package AnyKernel3 ZIP
        run: |
          set -euo pipefail
          ZIP="ZeroTwo-Kernel-5.15.170-BakaSU-${VERSION}.zip"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE
          cp anykernel3/anykernel.sh ak3/anykernel.sh
          sed -i "s|^kernel.string=.*|kernel.string=$NAME Android17 Kernel for all Xiaomi Miatoll devices (5.15.170-Android17-$NAME)|" ak3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz ak3/
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          if [ -s out/arch/arm64/boot/dtbo.img ]; then cp out/arch/arm64/boot/dtbo.img ak3/; fi

          (cd ak3 && zip -r9 "../$ZIP" . -x '.git*')
          sha256sum "$ZIP" > "$ZIP.sha"; unzip -t "$ZIP" >/dev/null
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          {
            echo "![Banner](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/assets/banner.png)"
            echo
            echo "## Android17 Kernel (BakaSU)"
            echo
            echo "Kernel build for **all Xiaomi Miatoll-family devices**"
            echo
            echo "### Kernel information"
            echo "- Kernel release: \`5.15.170-Android17-$NAME\`"
            echo "- Type: \`BakaSU (Root)\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo
            echo "### Files"
            echo "- \`$ZIP\` — flashable AnyKernel3 package"
            echo "- \`$ZIP.sha\` — SHA-256 checksum"
            echo
            echo "Build fingerprint: \`$FP\`"
            echo "<!-- android17-fingerprint: $FP -->"
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --yes --cleanup-tag; fi

          gh release create "$TAG" "$ZIP" "$ZIP.sha" \
            --target "$GITHUB_SHA" \
            --title "$TAG | ZeroTwo Kernel 5.15.170-Android17-$NAME" \
            --notes-file release-notes.md

      - name: Notify Telegram Bot
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::Faltan los secretos TELEGRAM_TOKEN o TELEGRAM_CHAT_ID. Saltando notificación."
            exit 0
          fi

          BANNER_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/assets/banner.png"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          CHANGELOG=$(git log -3 --pretty=format:"- %s")

          CAPTION="$(printf '%s\n' \
            "🚀 <b>New Kernel Release!</b> 🚀" \
            "" \
            "<b>$TAG | ZeroTwo Kernel 5.15.170-Android17-$NAME</b>" \
            "" \
            "👤 <b>Maintainer:</b> @JG_ryuu" \
            "" \
            "<b>Changelog:</b>" \
            "$CHANGELOG" \
            "" \
            "📥 <a href='$RELEASE_URL'>Download here</a>")"

          jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg photo "$BANNER_URL" \
            --arg caption "$CAPTION" \
            '{chat_id: $chat_id, photo: $photo, caption: $caption, parse_mode: "HTML"}' > payload.json

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendPhoto" \
            -H "Content-Type: application/json" \
            -d @payload.json
